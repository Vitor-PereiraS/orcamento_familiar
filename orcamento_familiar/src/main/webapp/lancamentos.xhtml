<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui" >

<h:head>
	<title>Lista de lancamentos</title>

	<style>
		* {
	  margin: 0;
	  padding: 0;
	  box-sizing: border-box;
	}
		
		html, body {
	  margin: 0;
	  padding: 0;
	  width: 100%;
	  height: 100%;
	}
		
		/* Faz o fundo do menubar encostar nas bordas da tela */
	.menubar-full {
	  width: 100%;
	  padding: 20px;
	  border-radius: 0 !important; /* Remove cantos arredondados padrão do tema */
	  border-left: none !important;
	  border-right: none !important;
	  padding: 15px 0 !important; /* Espaçamento vertical (substitui o padding: 20px) */
	}
	
	/* Limita e centraliza apenas os itens (links e botão Sair) dentro do menu */
	.menubar-full > .ui-menu-list {
	  max-width: 1300px; /* Use a mesma largura do seu .container */
	  margin: 0 auto !important;
	  padding: 0 20px;   /* Mesmo respiro lateral do seu .container */
	  box-sizing: border-box;
	  display: flex;
	  align-items: center;
	}
	
	/* Empurra o botão "Sair" (facet options) para a extrema direita do container */
	.menubar-full .ui-menubar-options {
	  margin-left: auto;
	}
		
	.container {
	  width: 100%;
	  max-width: 1300px; /* Largura máxima em telas grandes */
	  margin: 0 auto;    /* Centraliza o container na horizontal */
	  padding: 0 20px;   /* Dá um respiro nas bordas em telas menores (celular) */
	  box-sizing: border-box; /* Garante que o padding não estoure a largura de 100% */
	}
		
	.filtrados {
		border: 2px solid #cccccc;
		border-radius: 5px;
		padding: 20px;
		box-sizing: border-box;
	}
	
	.filtro {
		display: flex;
		flex-direction: row;
		box-sizing: border-box;
		gap: 20px;
		width: 100%;
		
		flex-wrap: wrap;
	}
	
	.divDialog {
		display: flex;
		flex-direction: column;
		box-sizing: border-box;
		gap: 5px;
	}
	
	.divDialogColunas {
		display: flex;
		box-sizing: border-box;
		gap: 20px;
	}
	
	.primeira-maiuscula {
		display: inline-block;
		text-transform: lowercase;
	}
	
	.primeira-maiuscula::first-letter {
		text-transform: uppercase;
	}

/* Ajusta a largura do componente inteiro */
    .ui-fileupload {
        width: 100% !important;
        box-sizing: border-box;
    }

    .ui-fileupload-content {
        padding: 8px !important;
        overflow: hidden;
    }

    /* Transforma a tabela interna em bloco responsivo */
    .ui-fileupload-files,
    .ui-fileupload-files tbody {
        display: block;
        width: 100% !important;
    }

    /* Organiza cada arquivo selecionado em uma linha flexível e alinhada */
    .ui-fileupload-row {
        display: flex !important;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        width: 100%;
        padding: 4px 0;
        border-bottom: 1px solid #eee;
    }

    /* Remove padding padrão das células */
    .ui-fileupload-row > td {
        padding: 0 !important;
        display: block;
    }

    /* Esconde a 1ª célula (miniatura vazia que ocupa espaço à toa) */
    .ui-fileupload-row > td:first-child {
        display: none !important;
    }

    /* 2ª célula: Nome do arquivo com reticências (...) sem quebrar linha */
    .ui-fileupload-row > td:nth-child(2) {
        flex: 1;
        min-width: 0; /* Essencial para o ellipsis funcionar dentro do flex */
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 12px;
    }

    /* 3ª célula: Tamanho do arquivo (ex: 246.7 KB) */
    .ui-fileupload-row > td:nth-child(3) {
        white-space: nowrap;
        font-size: 11px;
        color: #666;
    }

    /* 4ª célula: Esconde a barra de progresso gigante que estava vazando */
    .ui-fileupload-progress,
    .ui-fileupload-row > td:nth-child(4) {
        display: none !important;
    }

    /* 5ª célula: Botão 'X' de remover */
    .ui-fileupload-row > td:nth-child(5) {
        flex-shrink: 0;
    }
    }
</style>
</h:head>
<h:body >
	<header>

		<h:form id="menuForm" style="margin: 0px;"  >
			<p:menubar styleClass="menubar-full" >

				<p:menuitem value="Lançamentos" outcome="/lancamentos"
					style="font-weight: bold;" />
				<p:menuitem value="Saldos" outcome="/saldos" />
				<p:menuitem value="Parametrização" outcome="/parametrizacao" />
		
				<f:facet name="options">
					<p:commandButton value="Sair" icon="ui-icon-extlink" action="index?faces-redirect=true" />
				</f:facet>
			</p:menubar>
		</h:form>

	</header>




	<p:messages id="mensagensGlobais" autoUpdate="true" closable="true"
		showDetail="true" />
	<h:form id="formPrincipal" styleClass="container"
		style=" width: 100%; border: 2px solid #cccccc; border-radius: 5px; padding: 10px; box-sizing: border-box; flex-direction: row;">


		<!-- PAINEL DE PESQUISA CUSTOMIZADO NO INÍCIO -->
		<h:panelGrid
			style=" width: 100%; border: 2px solid #cccccc; border-radius: 5px; display: flex; padding: 10px; box-sizing: border-box;">

			<h3>Filtros</h3>

			<p:outputPanel styleClass="filtro" style="margin-bottom: 10px;">
				<!-- Filtro datas -->
				<p:outputPanel styleClass="filtrados">
					<p:outputLabel value="Período " />
					<p:calendar id="dataInicio" placeholder="data Inicio"
						pattern="MM/yyyy" mask="true" converter="localDateConverter"
						style="margin-right: 10px;">

					</p:calendar>
					<p:calendar id="dataFim" placeholder="data final" pattern="MM/yyyy"
						mask="true" converter="localDateConverter">

					</p:calendar>
				</p:outputPanel>


				<!-- Filtro Natureza -->
				<p:outputPanel styleClass="filtrados"
					style="display: flex; align-items: center;  gap: 8px;">
					<p:outputLabel value="Natureza " />
					<p:selectOneMenu label="Natureza">
						<f:selectItem itemLabel="Todas" itemValue="#{null}"
							noSelectionOption="true" />
					</p:selectOneMenu>
				</p:outputPanel>

				<!-- Filtro escopo -->
				<p:outputPanel styleClass="filtrados"
					style="display: flex; align-items: center;  gap: 8px;">
					<p:outputLabel value="Escopo " />
					<p:selectOneMenu label="Escopo">

						<f:selectItem itemLabel="Todos" itemValue="#{null}"
							noSelectionOption="true" />
					</p:selectOneMenu>
				</p:outputPanel>

				<!-- Filtro Forma -->
				<p:outputPanel styleClass="filtrados"
					style="display: flex; align-items: center;  gap: 8px;">
					<p:outputLabel value="Forma " />
					<p:selectOneMenu label="Forma">
						<f:selectItem itemLabel="Todas" itemValue="#{null}"
							noSelectionOption="true" />
					</p:selectOneMenu>
				</p:outputPanel>
			
				<!-- Filtro Usuário -->
				<p:outputPanel styleClass="filtrados"
					style="display: flex; align-items: center;  gap: 8px;">
					<p:outputLabel value="Usuario " />
					<p:selectOneMenu label="Usuario">

						<f:selectItem itemLabel="Todos" itemValue="#{null}"
							noSelectionOption="true" />
					</p:selectOneMenu>
				</p:outputPanel>

				<!-- Filtro Título -->
				<p:outputPanel styleClass="filtrados">
					<p:inputText id="valorTitulo" placeholder="Título contém..."
						style="width: 500px;" />
				</p:outputPanel>

				<!-- Botão Pesquisar -->
				<p:outputPanel style=" box-sizing: border-box;">
					<p:commandButton value="Pesquisar" update="@this"
						style="padding: 20px; width: 200px;" />
				</p:outputPanel>
				<!-- Botão Limpar -->
				<p:outputPanel style=" box-sizing: border-box;">
					<p:commandButton value="Limpar" update="formPrincipal"
						style="padding: 20px; width: 200px;" />
				</p:outputPanel>
			</p:outputPanel>
		</h:panelGrid>

		<br />

		<p:dataTable id="tabelaLancamento"
			value="#{lancamentoView.lancamentos}" var="lanc" paginator="true"
			rows="5" selection="#{lancamentoView.lancamentoSelecionado}"
			emptyMessage="Nenhum lançamento encontrado com esses critérios"
			paginatorPosition="bottom" sortMode="multiple" rowKey="#{lanc.id}"
			unselectable="true" metaKeySelection="false">

			<p:column headerText="Data" sortBy="#{lanc.data}">
				<h:outputText value="#{lanc.data}"
					converter="localDateOnlyConverter">
				</h:outputText>
			</p:column>

			<p:column headerText="Título" sortBy="#{lanc.titulo}">
				<h:outputText value="#{lanc.titulo}" styleClass="primeira-maiuscula" />
			</p:column>

			<p:column headerText="Natureza" sortBy="#{lanc.natureza}">
				<h:outputText value="#{lanc.natureza}"
					styleClass="primeira-maiuscula" />
			</p:column>

			<p:column headerText="Forma" sortBy="#{lanc.forma}">
				<h:outputText value="#{lanc.forma}" styleClass="primeira-maiuscula" />
			</p:column>


			<p:column headerText="Escopo" sortBy="#{lanc.escopo}">
				<h:outputText value="#{lanc.escopo}" styleClass="primeira-maiuscula" />
			</p:column>

			<p:column headerText="Usuário" sortBy="#{lanc.usuario.nome}">
				<h:outputText value="#{lanc.usuario.nome}" />
			</p:column>

			<p:column headerText="Valor" sortBy="#{lanc.valor}">
				<h:outputText value="#{lanc.valor}">
					<f:convertNumber type="currency" currencySymbol="R$" locale="pt_BR" />
				</h:outputText>
			</p:column>

		</p:dataTable>

		<br />

		<p:outputPanel id="painelBotao" layout="block">
			<p:commandButton id="btnNovo" value="Novo" icon="ui-icon-pencil"
				onclick="PF('dialogLancamento').show();" type="button" />

			<p:commandButton id="btnConsultar" value="Consultar"
				icon="ui-icon-search" update=":formDialogLancamento"
				oncomplete="PF('dialogLancamento').show();" />

			<p:commandButton id="btnEditar" value="Editar"
				icon="pi pi-plus-circle" update=":formDialogLancamento"
				oncomplete="PF('dialogLancamento').show();" />

			<p:commandButton id="btnDeletar" value="Excluir" icon="ui-icon-trash"
				update=":formDialogLancamento">
				<p:confirm header="Confirmação"
					message="Deseja realmente excluir o lancamento?"
					icon="ui-icon-alert" />
			</p:commandButton>
		</p:outputPanel>
	</h:form>


	<p:dialog header="Lançamento" widgetVar="dialogLancamento" modal="true"
		resizable="false" closeOnEscape="true" >
		<!-- Form exclusivo para os campos do novo departamento -->
		<h:form id="formDialogLancamento" enctype="multipart/form-data">

			<p:messages id="msgDialog" autoUpdate="true" />

			<p:outputPanel
				style=" width: 100%;  padding: 10px; display: flex; flex-direction: column; box-sizing: border-box;  gap: 20px; justify-content: space-between;">

				<div class="divDialogColunas">
					<!-- Natureza -->
					<div class="divDialog">
						<p:outputLabel for="naturza" value="Natureza" />
						<p:selectOneMenu id="naturza" required="true">
							<!-- Opção padrão/placeholder -->
							<f:selectItem itemLabel="despesa" itemValue=""
								noSelectionOption="true" />
						</p:selectOneMenu>
					</div>
					<div class="divDialog">
						<!-- Forma -->
						<p:outputLabel for="forma" value="Forma" />
						<p:selectOneMenu id="forma" required="true">
							<!-- Opção padrão/placeholder -->
							<f:selectItem itemLabel="Débito" itemValue=""
								noSelectionOption="true" />
						</p:selectOneMenu>
					</div>
				</div>

				<div class="divDialogColunas">

					<div class="divDialog">
						<!-- Escopo -->
						<p:outputLabel for="escopo" value="Escopo" />
						<p:selectOneMenu id="escopo" required="true">
							<!-- Opção padrão/placeholder -->
							<f:selectItem itemLabel="Débito" itemValue=""
								noSelectionOption="true" />
						</p:selectOneMenu>
					</div>
					<div class="divDialog">

						<!-- Usuário -->
						<p:outputLabel for="usuario" value="Usuário" />
						<p:inputText id="usuario" value="Usuário A" required="true"
							requiredMessage="O Usuário é obrigatório!" />
					</div>
				</div>

				<div class="divDialog">
					<!-- Título -->
					<p:outputLabel for="titulo" value="Título:" />
					<p:inputText id="titulo" value="Mercado do mês" required="true"
						requiredMessage="O titulo é obrigatório!" />

				</div>
				<div class="divDialogColunas">

					<div class="divDialog">
						<!-- valor -->
						<p:outputLabel for="valor" value="Valor" />
						<p:inputText id="valor" value="612,40" required="true"
							requiredMessage="O valor é obrigatório!"
							validatorMessage="O valor não pode ser negativo."
							onkeypress="if(event.which &lt; 48 || event.which &gt; 57) return false;">

							<f:validateLongRange minimum="0" />
							<f:convertNumber minFractionDigits="2" maxFractionDigits="2"
								locale="pt_BR" />
						</p:inputText>
					</div>

					<div class="divDialog">
						<!-- Data de compra -->
						<p:outputLabel for="data" value="Data de compra" />
						<p:calendar id="data" required="true"
							requiredMessage="A Data de compra é obrigatória!"
							pattern="dd/MM/yyyy" mask="true" converter="localDateConverter" />
					</div>

				</div>
				<div class="divDialog">
					<!-- Descrição -->
					<p:outputLabel for="descricao" value="Descrição" />
					<p:inputTextarea id="descricao"
						value="Compra mensal no supermercado" />
				</div>
			</p:outputPanel>



			<p:panelGrid columns="2" columnClasses="ui-grid-col-5, ui-grid-col-7"
				layout="grid" styleClass="ui-panelgrid-blank" style="box-sizing: border-box;">

				<!-- COLUNA 1: Upload -->
				<p:outputPanel style="box-sizing: border-box;">
					<p:fileUpload style="box-sizing: border-box;"
						fileUploadListener="#{documentoBean.handleFileUpload}"
						mode="advanced" dragDropSupport="true" fileLimit="3"
						update="painelPrevia msgDialog" sizeLimit="5242880"
						allowTypes="/(\.|\/)(pdf|jpg|jpeg|png|txt)$/" label="Escolher"
						uploadLabel="Enviar" cancelLabel="Cancelar"
						invalidSizeMessage="O arquivo excede o limite de 5MB."
						invalidFileMessage="Tipo de arquivo inválido."
						fileLimitMessage="Limite máximo de 3 arquivos atingido."
						oncomplete="PF('dialogLancamento').initPosition();"
						process="@this" />


					<p:messages id="messages" showDetail="true" autoUpdate="true"
						closable="true" />
				</p:outputPanel>

				<!-- COLUNA 2: Prévia do Documento -->
				<p:outputPanel id="painelPrevia"
					style="border: 1px solid #ccc; height: 300px; width: 100%; display: flex; align-items: center; justify-content: center; background: #f9f9f9; overflow: hidden;">>

					<!-- Mensagem inicial -->
					<h:outputText value="Nenhum documento selecionado"
						rendered="#{empty documentoBean.arquivoBase64 and empty documentoBean.conteudoTexto}" />

					<!-- Prévia se for PDF (layout="block" cria uma <div> com 100% de largura) -->
					<h:panelGroup layout="block" rendered="#{documentoBean.isPdf()}"
						style="width: 100%; height: 100%;">
						<embed src="#{documentoBean.arquivoBase64}" type="application/pdf"
							width="100%" height="100%" />
					</h:panelGroup>

					<!-- Prévia se for Imagem -->
					<h:graphicImage value="#{documentoBean.arquivoBase64}"
						rendered="#{documentoBean.isImagem()}"
						style="max-width: 100%; max-height: 440px; object-fit: contain;" />

					<!-- Prévia se for TXT -->
					<h:panelGroup layout="block" rendered="#{documentoBean.isTexto()}"
						style="width: 100%; height: 100%; overflow: auto; padding: 10px; text-align: left;">
						<pre style="white-space: pre-wrap; margin: 0;">#{documentoBean.conteudoTexto}</pre>
					</h:panelGroup>

				</p:outputPanel>


			</p:panelGrid>

			<br />

			<p:commandButton value="Salvar" update=":formPrincipal"
				icon="ui-icon-disk"
				oncomplete="if (!args.validationFailed) PF('dialogNovoDep').hide();" />
			<p:commandButton value="Limpar" type="reset" icon="ui-icon-refresh"
				style="margin-left: 10px;" />

		</h:form>

	</p:dialog>

</h:body>

</html>
