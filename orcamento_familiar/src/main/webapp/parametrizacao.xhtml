<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui">

<h:head>
	<title>Parametrização</title>
	<style>
	* {
	  margin: 0;
	  padding: 0;
	  box-sizing: border-box;
	}
		
		html, body {
	  margin: 0;
	  padding: 0;
	  width: 100%;
	  height: 100%;
	}
		
		/* Faz o fundo do menubar encostar nas bordas da tela */
	.menubar-full {
	  width: 100%;
	  padding: 20px;
	  border-radius: 0 !important; /* Remove cantos arredondados padrão do tema */
	  border-left: none !important;
	  border-right: none !important;
	  padding: 15px 0 !important; /* Espaçamento vertical (substitui o padding: 20px) */
	}
	
	/* Limita e centraliza apenas os itens (links e botão Sair) dentro do menu */
	.menubar-full > .ui-menu-list {
	  max-width: 1300px; /* Use a mesma largura do seu .container */
	  margin: 0 auto !important;
	  padding: 0 20px;   /* Mesmo respiro lateral do seu .container */
	  box-sizing: border-box;
	  display: flex;
	  align-items: center;
	}
	
	/* Empurra o botão "Sair" (facet options) para a extrema direita do container */
	.menubar-full .ui-menubar-options {
	  margin-left: auto;
	}
		
	.container {
	  width: 100%;
	  max-width: 1300px; /* Largura máxima em telas grandes */
	  margin: 0 auto;    /* Centraliza o container na horizontal */
	  padding: 0 20px;   /* Dá um respiro nas bordas em telas menores (celular) */
	  box-sizing: border-box; /* Garante que o padding não estoure a largura de 100% */
	}
	
	/* Transforma cada célula da tabela do PrimeFaces em um bloco flexível centralizado */
	.checkbox-alinhado td {
		display: inline-flex;
		align-items: center;
		margin-right: 1px; /* Espaço entre uma opção e outra */
		padding: 0;
	}
	
	/* Remove margens internas do PrimeFaces que empurram a caixinha */
	.checkbox-alinhado .ui-chkbox {
		margin: 0 6px 0 0 !important;
		display: inline-flex;
		align-items: center;
	}
	
	/* Zera a margem do texto e ajusta a altura da linha */
	.checkbox-alinhado label {
		margin: 0 !important;
		padding: 0 !important;
		line-height: 1 !important;
		cursor: pointer;
		
	}
</style>
</h:head>

<h:body>

	<header>
		<h:form id="menuForm">
			<p:menubar styleClass="menubar-full">
				<p:menuitem value="Lançamentos" outcome="/lancamentos" />
				<p:menuitem value="Saldos" outcome="/saldos"   />
				<p:menuitem value="Parametrização" outcome="/parametrizacao" style="font-weight: bold;"/>
				<f:facet name="options">
					<p:commandButton value="Sair" icon="ui-icon-extlink" action="index?faces-redirect=true" />
				</f:facet>
			</p:menubar>
		</h:form>
	</header>


	<p:messages id="mensagensGlobais" autoUpdate="true" closable="true"
		showDetail="true" />
	<h:form id="formPrincipal" styleClass="container"
		style=" width: 100%; border: 2px solid #cccccc; border-radius: 5px; padding: 10px; box-sizing: border-box;">


		<!-- PAINEL DE credito e limite mínimo de saldo-->
		<p:outputPanel title="creditoLimite"
			style=" width: 100%;  padding: 10px; display: grid; gap:20px;  grid-template-columns: repeat(2, 1fr);  justify-content:space-between; box-sizing: border-box;   ">

			<p:outputPanel
				style="display: flex; flex-direction: column; border: 2px solid #cccccc; border-radius: 5px; padding: 10px; gap:5px;">

				<p:outputLabel value="Limite de crédito pessoal (mês)" />

				<div
					style="display: flex; justify-content: space-between; gap: 20px;">
					<p:outputLabel value="Usuário A (R$)" />
					<h:inputText value="#{1000.00}">
						<f:convertNumber type="currency" currencySymbol="R$"
							locale="pt_BR" />
					</h:inputText>
				</div>

				<div
					style="display: flex; justify-content: space-between; gap: 20px;">
					<p:outputLabel value="Usuário B (R$)" />
					<h:inputText value="#{1000.00}">
						<f:convertNumber type="currency" currencySymbol="R$"
							locale="pt_BR" />
					</h:inputText>
				</div>

			</p:outputPanel>

			<p:outputPanel
				style="display: flex; flex-direction: column; border: 2px solid #cccccc; border-radius: 5px; padding: 10px; gap:5px;">

				<p:outputLabel value="Limite mínimo de saldo" />

				<div
					style="display: flex; justify-content: space-between; gap: 20px;">
					<p:outputLabel value="Saldo comum (R$)" />
					<h:inputText value="#{00.00}">
						<f:convertNumber type="currency" currencySymbol="R$"
							locale="pt_BR" />
					</h:inputText>
				</div>

				<div
					style="display: flex; justify-content: space-between; gap: 20px;">
					<p:outputLabel value="Saldo Pessoal(R$)" />
					<h:inputText value="#{00.00}">
						<f:convertNumber type="currency" currencySymbol="R$"
							locale="pt_BR" />
					</h:inputText>
				</div>
			</p:outputPanel>
		</p:outputPanel>

		<!-- PAINEL DE ANEXOS -->
		<p:outputPanel
			style=" width: 100%; border: 2px solid #cccccc; border-radius: 5px; padding: 10px; box-sizing: border-box;">
			<h3>Anexos</h3>
			<p:outputPanel title="anexos"
				style=" width: 100%; display: grid; gap:20px;  grid-template-columns: repeat(2, 1fr); box-sizing: border-box; margin-bottom: 10px;">

				<p:outputPanel
					style="display: flex; flex-direction: column; gap: 8px;">

					<div style="display: grid; gap:20px;  grid-template-columns: repeat(2, 1fr);">
						<p:outputLabel value="Qtd. máx. por lançamento"
							style="margin-right: 10px" />

						<h:inputText value="#{3}">
							<f:convertNumber type="number" />
						</h:inputText>
					</div>

					<div style="display: grid; gap:20px;  grid-template-columns: repeat(2, 1fr);">
						<p:outputLabel value="Tamanho máx.(KB)" style="margin-right: 10px" />

						<h:inputText value="#{2048}">
							<f:convertNumber type="number" />
						</h:inputText>
					</div>
				</p:outputPanel>

				<p:outputPanel
					style="display: flex; flex-direction: column; gap: 8px;">

					<div style="display: grid; gap:20px;  grid-template-columns: repeat(2, 1fr);">
						<p:outputLabel value="Tipos permitidos" style="margin-right: 10px" />

						<p:selectManyCheckbox id="opcoes" styleClass="checkbox-alinhado">
							<f:selectItem itemLabel="JPG" itemValue="JPG" />
							<f:selectItem itemLabel="PNG" itemValue="PNG" />
							<f:selectItem itemLabel="PDF" itemValue="PDF" />
						</p:selectManyCheckbox>
					</div>

					<div style="display: grid; gap:20px;  grid-template-columns: repeat(2, 1fr);">
						<p:outputLabel value="Anexo obrigatório em despesa"
							style="margin-right: 10px" />

						<p:selectManyCheckbox id="opcao" styleClass="checkbox-alinhado">
							<f:selectItem itemLabel="Sim" itemValue="sim" />
						</p:selectManyCheckbox>
					</div>
				</p:outputPanel>
			</p:outputPanel>
		</p:outputPanel>
		<br />

		<p:commandButton value="Editar" update=":formPrincipal"/>
		<p:commandButton value="Salvar" update=":formPrincipal" style="margin-left: 10px;"
			oncomplete="if (!args.validationFailed) PF('dialogNovoDep').hide();" />
		<p:commandButton value="Cancelar" type="reset"
style="margin-left: 10px;" />

	</h:form>
</h:body>

</html>
