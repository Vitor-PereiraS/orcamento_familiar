<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui">

<h:head>
	<title>Teste PrimeFaces 5.2</title>
</h:head>

<h:body>

	<p:panel header="Login" style="width: 650px; margin: 50px auto;">

		<div class="divDialog" style="margin: 0px 0px 10px 0px ;">
			<p:outputLabel for="usuario" value="Usuario" />
			<p:inputText id="usuario"  required="true"
				requiredMessage="Digite o Usuario!" />

		</div>
		<div class="divDialog">
			<p:outputLabel for="senha" value="Senha" />
			<p:password id="senha" required="true"
				requiredMessage="Digite a senha!" />
		</div>
		
		<br />

			<p:commandButton value="Entrar" action="lancamentos?faces-redirect=true"/>
	</p:panel>

</h:body>
</html>
